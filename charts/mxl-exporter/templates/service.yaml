{{- if .Values.service.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mxl-exporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mxl-exporter.labels" . | nindent 4 }}
    {{- with .Values.service.labels }}
    {{- include "mxl-exporter.stringMap" . | nindent 4 }}
    {{- end }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- include "mxl-exporter.stringMap" . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.clusterIP }}
  clusterIP: {{ . | quote }}
  {{- end }}
  ports:
    - name: metrics
      port: {{ .Values.service.port }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "mxl-exporter.selectorLabels" . | nindent 4 }}
{{- end }}
